<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EDA早报 · 2026-11-22</title>
  <style>
    :root {
      --bg: #efebe3;
      --paper: #fffcf7;
      --ink: #1b1814;
      --muted: #6d675c;
      --line: #e4ddd0;
      --accent: #9c3b16;
      --p0: #9c3b16;
      --p0-bg: #f8ebe4;
      --p1: #215246;
      --p1-bg: #e7f0ec;
      --p2: #5c574e;
      --p2-bg: #eeebe4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .sheet {
      max-width: 720px;
      margin: 32px auto;
      background: var(--paper);
      padding: 40px 40px 32px;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(27, 24, 20, 0.04), 0 12px 32px rgba(27, 24, 20, 0.06);
    }
    header.mast {
      border-bottom: 2px solid var(--ink);
      padding-bottom: 20px;
      margin-bottom: 28px;
    }
    .kicker {
      margin: 0 0 8px;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .lede {
      margin: 0 0 32px;
      font-size: 18px;
      line-height: 1.7;
    }
    section.group { margin: 0 0 32px; }
    section.group h2 {
      margin: 0 0 14px;
      font-size: 13px;
      font-weight: 600;
    }
    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      letter-spacing: 0.06em;
    }
    .pill.p0 { color: var(--p0); background: var(--p0-bg); }
    .pill.p1 { color: var(--p1); background: var(--p1-bg); }
    .pill.p2 { color: var(--p2); background: var(--p2-bg); }
    ol.items {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    ol.items li {
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }
    ol.items li:last-child { padding-bottom: 0; }
    ol.items h3 {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 650;
      line-height: 1.4;
    }
    ol.items h3 a {
      color: var(--ink);
      text-decoration: none;
    }
    ol.items h3 a:hover { color: var(--accent); }
    .why { margin: 0 0 8px; color: var(--ink); }
    .src { margin: 0; font-size: 13px; }
    .src a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .empty {
      padding: 20px 0 8px;
      color: var(--muted);
      font-size: 16px;
    }
    .source-updates {
      margin: 8px 0 28px;
      padding: 14px 16px;
      background: #f3efe6;
      border-left: 3px solid var(--ink);
      font-size: 14px;
    }
    .source-updates .label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    footer.colophon {
      border-top: 1px solid var(--line);
      margin-top: 12px;
      padding-top: 16px;
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 640px) {
      .sheet { margin: 0; padding: 28px 20px 24px; border-radius: 0; box-shadow: none; }
      h1 { font-size: 24px; }
      .lede { font-size: 17px; }
    }
    @media print {
      body { background: #fff; }
      .sheet { margin: 0; padding: 0; box-shadow: none; max-width: none; }
    }
  </style>
</head>
<body>
  <article class="sheet">
    <header class="mast">
      <p class="kicker">工作日早报</p>
      <h1>EDA早报</h1>
      <p class="meta">2026年11月22日 星期日 · 2026-11-21 08:00 – 2026-11-22 08:00（上海时间）</p>
    </header>
    <p class="lede">过去 24 小时窗口里，没有达到收录门槛的新行业或工具动态，也没有需要补入的漏报条目。</p>
<p class="empty">本日无达到收录门槛的资讯。</p>
    <footer class="colophon">共用模板 v1 · 请勿改版 · 生成于 2026-11-22 08:09（上海时间）</footer>
  </article>
</body>
</html>
